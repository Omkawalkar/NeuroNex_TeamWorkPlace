<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>NeuroNex - Select Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="workspace.css">
</head>
<body>

    <header class="fixed top-0 left-0 right-0 h-16 bg-surface border-b border-outline-variant/30 flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-md">
            <div class="relative flex items-center">
                <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">search</span>
                <input type="text" placeholder="Search..." class="bg-surface neumorphic-inset rounded-full py-2 pl-10 pr-4 text-body-sm border-none focus:ring-2 focus:ring-primary/20 w-96">
            </div>
        </div>
        <div class="flex items-center gap-md">
            <div class="hidden md:flex flex-col items-end mr-2">
                <span class="text-label-sm text-on-surface-variant opacity-70">Last synced: 2 mins ago</span>
            </div>
            <div class="relative">
                <button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" onclick="toggleDropdown('notification-dropdown')">
                    <span class="material-symbols-outlined">notifications</span>
                </button>
                <div id="notification-dropdown" class="hidden absolute right-0 top-full mt-4 w-80 bg-surface rounded-2xl neumorphic-raised p-md z-50 flex flex-col gap-xs border border-outline-variant/10 transition-all duration-300 opacity-0 -translate-y-2">
                    <div class="px-sm py-2 border-b border-outline-variant/10 mb-1">
                        <span class="text-label-md text-on-surface">Notifications</span>
                    </div>
                    <button class="flex items-start gap-sm p-sm rounded-xl hover:bg-primary-container/10 text-on-surface transition-colors w-full text-left">
                        <div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined text-primary text-[18px]">share</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-label-md">New project shared</span>
                            <span class="text-body-sm text-on-surface-variant opacity-70">Sarah Johnson shared 'Q4 Strategy'</span>
                        </div>
                    </button>
                    <button class="flex items-start gap-sm p-sm rounded-xl hover:bg-primary-container/10 text-on-surface transition-colors w-full text-left">
                        <div class="w-8 h-8 rounded-full bg-tertiary-container/20 flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined text-tertiary text-[18px]">schedule</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-label-md">Meeting starting in 5 mins</span>
                            <span class="text-body-sm text-on-surface-variant opacity-70">Weekly Sync with Design Team</span>
                        </div>
                    </button>
                    <button class="flex items-start gap-sm p-sm rounded-xl hover:bg-primary-container/10 text-on-surface transition-colors w-full text-left">
                        <div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined text-primary text-[18px]">comment</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-label-md">New comment on Q3 Roadmap</span>
                            <span class="text-body-sm text-on-surface-variant opacity-70">Alex Chen: "Let's review the timeline..."</span>
                        </div>
                    </button>
                    <button class="flex items-start gap-sm p-sm rounded-xl hover:bg-error-container/20 text-on-surface transition-colors w-full text-left">
                        <div class="w-8 h-8 rounded-full bg-error-container flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined text-error text-[18px]">warning</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-label-md">Storage almost full</span>
                            <span class="text-body-sm text-on-surface-variant opacity-70">Workspace is at 92% capacity</span>
                        </div>
                    </button>
                    <div class="h-px bg-outline-variant/20 my-1"></div>
                    <button class="p-2 text-center text-label-sm text-primary hover:underline w-full">View all notifications</button>
                </div>
            </div>
            <div class="flex items-center gap-sm">
                <div class="relative">
                    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBtUJ4BElszLs_BJEz6TwcOujpOo0esbZ9LjX2x-GaTru0enidP9Q1LVp5_sB4rzNEZmhrGUqhLz5AKGueVUCW-NnilQPwYAz3ZxkgIIrecf9geRtnxq-9gJjVTMnMWZGki7hKPSvOolPl7PuSsSx2-sPlQ_xIqHu4Su1qVcym6SD_5hIJCD4WmyPXnqGYKXH6k2nGTgFyKabCL-0guB2YM0R7xB5nfRwWNm2mwEmg7Ntk0Ny14rlK7" class="w-10 h-10 rounded-full border-2 border-primary-container object-cover cursor-pointer" alt="Profile" onclick="toggleDropdown('profile-dropdown')">
                    <span class="absolute -top-1 -right-1 bg-tertiary text-on-tertiary text-[10px] font-bold px-1.5 py-0.5 rounded-full uppercase tracking-wider">Pro</span>
                    <div id="profile-dropdown" class="hidden absolute right-0 top-full mt-4 w-64 bg-surface rounded-2xl neumorphic-raised p-md z-50 flex flex-col gap-xs border border-outline-variant/10 transition-all duration-300 opacity-0 -translate-y-2">
                        <button class="flex items-center gap-sm p-sm rounded-xl hover:bg-primary-container/10 text-on-surface transition-colors w-full text-left">
                            <span class="material-symbols-outlined text-on-surface-variant">person</span>
                            <span class="text-label-md">Profile &amp; Account</span>
                        </button>
                        <button class="flex items-center gap-sm p-sm rounded-xl hover:bg-primary-container/10 text-on-surface transition-colors w-full text-left">
                            <span class="material-symbols-outlined text-on-surface-variant">palette</span>
                            <span class="text-label-md">Appearance</span>
                        </button>
                        <button class="flex items-center gap-sm p-sm rounded-xl hover:bg-primary-container/10 text-on-surface transition-colors w-full text-left">
                            <span class="material-symbols-outlined text-on-surface-variant">notifications</span>
                            <span class="text-label-md">Notifications</span>
                        </button>
                        <button class="flex items-center gap-sm p-sm rounded-xl hover:bg-primary-container/10 text-on-surface transition-colors w-full text-left">
                            <span class="material-symbols-outlined text-on-surface-variant">security</span>
                            <span class="text-label-md">Privacy &amp; Security</span>
                        </button>
                        <div class="h-px bg-outline-variant/20 my-1"></div>
                        <button class="flex items-center gap-sm p-sm rounded-xl hover:bg-primary-container/10 text-on-surface transition-colors w-full text-left">
                            <span class="material-symbols-outlined text-on-surface-variant">groups</span>
                            <span class="text-label-md">Workspace &amp; Team</span>
                        </button>
                        <button class="flex items-center gap-sm p-sm rounded-xl hover:bg-primary-container/10 text-on-surface transition-colors w-full text-left">
                            <span class="material-symbols-outlined text-on-surface-variant">extension</span>
                            <span class="text-label-md">Integrations</span>
                        </button>
                        <button class="flex items-center gap-sm p-sm rounded-xl hover:bg-primary-container/10 text-on-surface transition-colors w-full text-left">
                            <span class="material-symbols-outlined text-on-surface-variant">help</span>
                            <span class="text-label-md">Help &amp; Support</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="w-full max-w-2xl mx-auto flex flex-col items-center gap-xl">
        <header class="text-center space-y-4">
            <h1 class="font-display-lg text-display-lg text-primary tracking-tight">NeuroNex</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant">Select a workspace to continue</p>
        </header>
        <div class="w-full space-y-md">
            <!-- Create New Workspace -->
            <button id="create-workspace-btn" class="w-full bg-surface rounded-[24px] p-lg neumorphic-raised flex items-center justify-center gap-md group cursor-pointer">
                <div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shadow-inner">
                    <span class="material-symbols-outlined">add</span>
                </div>
                <span class="font-headline-sm text-headline-sm text-primary">Create New Workspace</span>
            </button>
            <!-- Workspace list (rendered dynamically by workspace.js) -->
            <div id="workspace-list" class="w-full space-y-md">
                <div id="workspace-list-empty" class="hidden w-full bg-surface rounded-[24px] p-lg neumorphic-inset text-center text-on-surface-variant font-body-sm text-body-sm">
                    No workspaces yet. Create your first workspace to get started.
                </div>
                <div id="workspace-list-loading" class="w-full bg-surface rounded-[24px] p-lg neumorphic-inset text-center text-on-surface-variant font-body-sm text-body-sm">
                    Loading workspaces...
                </div>
            </div>
        </div>
    </main>

    <!-- Create Workspace Modal -->
    <div class="fixed inset-0 z-[100] modal-overlay flex items-center justify-center" id="create-workspace-modal-overlay">
        <div class="bg-surface shadow-neumorphic rounded-[32px] w-full max-w-[500px] p-8 modal-content m-4 border border-white/50 relative flex flex-col gap-6" id="create-workspace-modal-content">
            <div class="text-center">
                <h2 class="font-headline-md text-headline-md text-on-surface">New Workspace</h2>
                <p class="font-body-sm text-body-sm text-on-surface-variant mt-2 px-4">Create an empty workspace. You can invite teammates after it's set up.</p>
            </div>
            <div class="flex flex-col gap-2 mt-2">
                <span class="font-label-sm text-label-sm text-on-surface-variant font-medium ml-2">Workspace Name</span>
                <input id="workspace-name-input" type="text" maxlength="100" placeholder="e.g. Marketing Team" class="h-14 bg-surface shadow-neumorphic-inset rounded-full font-body-sm text-body-sm text-on-surface placeholder:text-on-surface-variant/60 focus:ring-0 outline-none px-4 border-none" />
            </div>
            <div class="flex flex-col gap-2">
                <span class="font-label-sm text-label-sm text-on-surface-variant font-medium ml-2">Color</span>
                <div class="flex items-center gap-3 justify-center" id="workspace-color-picker">
                    <button type="button" data-color="primary" class="color-swatch w-10 h-10 rounded-full bg-primary-container/20 border-2 border-primary-container flex items-center justify-center transition-all" title="Primary"></button>
                    <button type="button" data-color="secondary" class="color-swatch w-10 h-10 rounded-full bg-secondary-container border-2 border-transparent flex items-center justify-center transition-all" title="Secondary"></button>
                    <button type="button" data-color="tertiary" class="color-swatch w-10 h-10 rounded-full bg-tertiary-container border-2 border-transparent flex items-center justify-center transition-all" title="Tertiary"></button>
                </div>
            </div>
            <div class="hidden text-center" id="create-workspace-error">
                <span class="font-label-sm text-label-sm text-error"></span>
            </div>
            <div class="flex gap-3 justify-end mt-2">
                <button id="cancel-create-workspace" type="button" class="px-6 py-3 rounded-full font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-highest transition-colors">Cancel</button>
                <button id="confirm-create-workspace" type="button" class="px-6 py-3 rounded-full bg-primary-container text-on-primary font-label-md text-label-md hover:bg-primary transition-colors flex items-center gap-2">
                    <span class="material-symbols-outlined text-[18px]">add</span>
                    Create Workspace
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="workspace.js"></script>
</body>
</html>
