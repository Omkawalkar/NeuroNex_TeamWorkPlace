<!DOCTYPE html><html class="light" lang="en" style><head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <title>Tasks - Etheric Workspace</title>
        <script
            src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
            rel="stylesheet">
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet">
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="Task.css">
    </head>
    <body
        class="bg-surface text-on-surface font-body-md h-screen overflow-hidden flex selection:bg-primary-container selection:text-on-primary-container">
        <!-- Left Sidebar: SideNavBar -->

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col relative bg-surface">
            <!-- TopAppBar -->
            <header
                class="fixed top-0 right-0 z-30 px-gutter flex justify-between items-center w-full h-16 bg-surface dark:bg-surface-dim shadow-[0_4px_12px_rgba(70,60,120,0.04)]">
                <!-- Contextual Navigation (if any) -->
                <div class="flex-1 flex items-center gap-md">

                </div>
                <!-- Global Actions -->
                <div class="flex items-center gap-sm">
                    <!-- Search Input Inset -->
                    <div
                        class="hidden md:flex items-center neumorphic-inset rounded-full px-4 py-2 w-64 bg-surface mr-4">
                        <span
                            class="material-symbols-outlined text-outline mr-2 text-sm">search</span>
                        <input
                            class="bg-transparent border-none outline-none text-body-sm font-body-sm text-on-surface w-full focus:ring-0 placeholder:text-outline-variant p-0"
                            placeholder="Search workspace..." type="text">
                    </div>
                    <button
                        class="w-10 h-10 rounded-full flex items-center justify-center neumorphic-raised text-on-surface-variant hover:text-primary transition-colors">
                        <span
                            class="material-symbols-outlined">notifications</span>
                    </button>
                    <button
                        class="w-10 h-10 rounded-full flex items-center justify-center neumorphic-raised text-on-surface-variant hover:text-primary transition-colors md:hidden">
                        <span class="material-symbols-outlined">search</span>
                    </button>
                    <button
                        class="w-10 h-10 rounded-full flex items-center justify-center neumorphic-raised text-on-surface-variant hover:text-primary transition-colors">

                    </button>
                    <div id="admin-task-action-container" class="flex items-center">
                        <button id="open-task-modal-btn"
                            class="hidden md:flex ml-4 px-6 py-2 rounded-full bg-primary-container text-on-primary font-label-md text-label-md neumorphic-raised border-t border-white/20 hover:opacity-90 transition-opacity flex items-center gap-1.5 shadow-sm">
                            <span class="material-symbols-outlined text-[18px]">add_task</span>
                            New Task
                        </button>
                    </div>
                    <div
                        class="w-10 h-10 rounded-full neumorphic-raised overflow-hidden ml-4 border-2 border-surface p-0.5">
                        <img alt="User avatar" data-user-avatar class="w-full h-full object-cover rounded-full"
                            data-alt="A small circular profile picture of a professional woman with a soft smile in a bright, modern office setting with light mode aesthetic."
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6WZnIOKpeL4-vNpQp5vbjZQTOQGhKXBHRRSzYrFpslS9tqX7tajTwCt_YfZMZxkP0qQD7U8XR3usKgefEgH_Hos1Rs9Y92SAdDvXxpxlBqONUzYOWc4uhEXLHi4AF848ApD3afe3WiMzIiEXrkZsdU3MDz6jUM3I1amN94bwYFC8zGwByAzhYjraFIse8VHsNRtDu6BIV50IU0iB6EV9Gxf4Rvp_ggwRB30MUt-FUmUVhewpalUNY">
                    </div>
                </div>
            </header>
            <!-- Canvas -->
            <main
                class="flex-1 mt-16 p-container-margin overflow-y-auto flex gap-gutter">
                <!-- Center Tasks Content -->
                <div class="flex-1 flex flex-col h-full">
                    <div class="flex justify-between items-end mb-md">
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <a href="../Dashboard/dashboard.html"
                                    class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors neumorphic-raised">
                                    <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                                </a>
                                <h2 class="font-headline-lg text-headline-lg font-bold text-on-surface tracking-tight">Active Tasks</h2>
                            </div>
                            <p class="font-body-md text-body-md text-on-surface-variant" id="tasks-subtitle">Manage and track your current assignments across all projects.</p>
                        </div>
                        <div id="admin-status-badge"></div>
                    </div>

                    <!-- Admin Permission Notice Banner (shown to non-admins) -->
                    <div id="admin-permission-banner" class="hidden"></div>

                    <!-- Bento Grid for Tasks (Rendered Dynamically) -->
                    <div id="tasks-grid" class="grid grid-cols-1 xl:grid-cols-2 2xl:grid-cols-3 gap-md pb-xl">
                    </div>
                </div>
            </main>
        </div>

        <!-- Neumorphic Create Task Modal (Admin Only) -->
        <div id="create-task-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm hidden p-4">
            <div class="bg-surface shadow-[inset_-4px_-4px_12px_rgba(255,255,255,0.9),_0_20px_60px_rgba(70,60,120,0.18)] border border-white/60 rounded-3xl p-6 sm:p-8 w-full max-w-lg neu-raised relative">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl neumorphic-inset text-primary flex items-center justify-center">
                            <span class="material-symbols-outlined">add_task</span>
                        </div>
                        <div>
                            <h3 class="font-headline-sm font-bold text-on-surface">Create New Task</h3>
                            <p class="font-body-sm text-on-surface-variant text-xs flex items-center gap-1">
                                <span class="material-symbols-outlined text-[13px] text-primary">verified_user</span>
                                Workspace Admin Permission
                            </p>
                        </div>
                    </div>
                    <button id="close-task-modal-btn" class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface neumorphic-raised active:scale-95 transition-all" title="Close">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>
                <form id="create-task-form" class="flex flex-col gap-4">
                    <div>
                        <label class="font-label-sm text-on-surface-variant block mb-1">Task Title *</label>
                        <input id="task-title-input" required class="w-full h-11 px-4 rounded-xl bg-surface neumorphic-inset border-none text-on-surface text-body-sm focus:ring-2 focus:ring-primary/20 outline-none" placeholder="e.g. Review Brand Guidelines" />
                    </div>
                    <div>
                        <label class="font-label-sm text-on-surface-variant block mb-1">Description</label>
                        <textarea id="task-desc-input" rows="2" class="w-full p-3 rounded-xl bg-surface neumorphic-inset border-none text-on-surface text-body-sm focus:ring-2 focus:ring-primary/20 resize-none outline-none" placeholder="Details and instructions for the task..."></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="font-label-sm text-on-surface-variant block mb-1">Priority</label>
                            <select id="task-priority-input" class="w-full h-11 px-3 rounded-xl bg-surface neumorphic-inset border-none text-on-surface text-body-sm focus:ring-2 focus:ring-primary/20 outline-none">
                                <option value="High">High</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                        <div>
                            <label class="font-label-sm text-on-surface-variant block mb-1">Status</label>
                            <select id="task-status-input" class="w-full h-11 px-3 rounded-xl bg-surface neumorphic-inset border-none text-on-surface text-body-sm focus:ring-2 focus:ring-primary/20 outline-none">
                                <option value="In Progress" selected>In Progress</option>
                                <option value="Not Started">Not Started</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="font-label-sm text-on-surface-variant block mb-1">Due Date</label>
                            <input id="task-date-input" type="text" class="w-full h-11 px-4 rounded-xl bg-surface neumorphic-inset border-none text-on-surface text-body-sm focus:ring-2 focus:ring-primary/20 outline-none" placeholder="e.g. Oct 24" />
                        </div>
                        <div>
                            <label class="font-label-sm text-on-surface-variant block mb-1">Initial Progress (%)</label>
                            <input id="task-progress-input" type="number" min="0" max="100" value="35" class="w-full h-11 px-4 rounded-xl bg-surface neumorphic-inset border-none text-on-surface text-body-sm focus:ring-2 focus:ring-primary/20 outline-none" />
                        </div>
                    </div>
                    <div>
                        <label class="font-label-sm text-on-surface-variant block mb-1">Assignee Name</label>
                        <input id="task-assignee-input" class="w-full h-11 px-4 rounded-xl bg-surface neumorphic-inset border-none text-on-surface text-body-sm focus:ring-2 focus:ring-primary/20 outline-none" placeholder="e.g. Sarah Jenkins" />
                    </div>
                    <div class="flex items-center justify-end gap-3 mt-2">
                        <button type="button" id="cancel-task-btn" class="h-11 px-5 rounded-xl neumorphic-raised font-label-md text-on-surface-variant hover:text-on-surface transition-all">Cancel</button>
                        <button type="submit" class="h-11 px-6 rounded-xl bg-primary-container text-white font-label-md flex items-center gap-2 neumorphic-raised hover:opacity-90 active:scale-95 transition-all shadow-md">
                            <span class="material-symbols-outlined text-[18px]">check</span>
                            Create Task
                        </button>
                    </div>
                </form>
            </div>
        </div>

                
        <script src="Task.js?v=20260903-3"></script>
    </body></html>
