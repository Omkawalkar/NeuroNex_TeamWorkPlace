<!DOCTYPE html><html class="light" lang="en" style><head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <title>Etheric - Saved Items</title>
        <script
            src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet">
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
            rel="stylesheet">
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet">
     <link rel="stylesheet" href="Save.css">
    </head>
    <body class="flex h-screen overflow-hidden font-body-md text-body-md">
        <!-- Left Column: Navigation / Team Chat (SideNavBar - Workspace) -->

        <!-- Center Column: Main Workspace -->
        <main
            class="flex-1 flex flex-col bg-surface-container-low h-screen overflow-hidden relative z-10">
            <!-- Top App Bar -->
            <header
                class="h-16 w-full flex justify-between items-center px-md sticky top-0 z-50 bg-surface shadow-[0_4px_12px_rgba(70,60,120,0.05)]">
                <div class="flex-1 max-w-2xl">
                    <div
                    class="relative w-64 md:w-80 h-10 rounded-xl neu-inset bg-surface flex items-center px-sm">
                    <span
                        class="material-symbols-outlined text-outline">search</span>
                    <input id="saved-search-input"
                        class="bg-transparent border-none focus:ring-0 text-body-sm font-body-sm text-on-surface placeholder:text-outline w-full ml-xs outline-none"
                        placeholder="Search saved items..." type="text">
                </div>
                </div>
                <div class="flex items-center gap-sm">
                    <button
                        class="w-10 h-10 rounded-full neumorphic-raised flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-95">
                        <span
                            class="material-symbols-outlined">notifications</span>
                    </button>
                    <div
                        class="w-10 h-10 rounded-full border-2 border-surface object-cover neumorphic-raised overflow-hidden">
                        <img alt="User Profile Avatar" data-user-avatar class="w-full h-full object-cover"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJAAPNF1PnCmYhDBxV7nZWMqW7at3W7IcK3zRIZML3Ofh8sKXAPyvGmXgAQnN-5xXYYsDazzK04TNDKCHQfFNTSDBhAE1Dqli68sw7CIwZUEW7uKBaz5EO02mFfp-H8Tez_s9H-qalWapJ61rgBt7zxiyWFJbhFueNRf_5_Y3mHfBLNySnQzDBvO8y2fW8lkbTO2PWfI5KtcTwJWwGCf66y0mJzorwIeFMl-bdo48wFtkmqwu5oCTL">
                    </div>
                </div>
            </header>
            <!-- Content Area -->
            <div class="flex-1 overflow-y-auto p-lg pb-xl">
                <div class="max-w-6xl mx-auto">
                    <div
                        class="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4">
                        <div class="flex items-center gap-2">
                            <a href="../Dashboard/dashboard.html"
                                class="w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-surface-variant transition-colors neumorphic-raised active:scale-95" title="Back to Dashboard">
                                <span class="material-symbols-outlined text-[20px]">arrow_back</span>
                            </a>
                            <div>
                                <h2 class="font-headline-lg text-headline-lg text-on-surface font-bold">Saved Items</h2>
                                <p id="saved-count-text" class="font-body-lg text-body-lg text-on-surface-variant">Loading saved items...</p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button data-filter="All"
                                class="saved-filter-btn px-4 py-2 rounded-full font-label-sm text-label-sm bg-primary text-white shadow-sm transition-all font-semibold">All</button>
                            <button data-filter="Documents"
                                class="saved-filter-btn px-4 py-2 rounded-full font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-high transition-colors neu-raised font-medium">Documents</button>
                            <button data-filter="Tasks"
                                class="saved-filter-btn px-4 py-2 rounded-full font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-high transition-colors neu-raised font-medium">Tasks</button>
                            <button data-filter="Presentations"
                                class="saved-filter-btn px-4 py-2 rounded-full font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-high transition-colors neu-raised font-medium">Presentations</button>
                            <button data-filter="Research"
                                class="saved-filter-btn px-4 py-2 rounded-full font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-high transition-colors neu-raised font-medium">Research</button>
                        </div>
                    </div>
                    <!-- Dynamic Grid of Saved Items -->
                    <div id="saved-items-grid"
                        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    </div>
                </div>
            </div>
        </main>
        <!-- Right Column: Utility Sidebar (SideNavBar - Utilities) -->
<Script src="Save.js"></Script>
    </body></html>
