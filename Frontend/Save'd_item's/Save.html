    <body class="flex h-screen overflow-hidden font-body-md text-body-md">

                    </button>
                    <button
                        class="w-10 h-10 rounded-full neumorphic-raised flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-95">

                            class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors neumorphic-raised">

                        </button><h2

                                            class="font-label-sm text-label-sm text-on-surface-variant">Alex
                                            Rivera</span>
                                    </div>
                                    <span
                                        class="font-label-sm text-label-sm text-secondary">Oct
                                        12</span>
                                </div>
                            </div>
                        </div>
                        <!-- Card 2 -->
                        <div
                            class="neumorphic-raised rounded-xl p-md flex flex-col justify-between neumorphic-hover group cursor-pointer h-48">

                                <div
                                    class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-tertiary">
                                    <span
                                        class="material-symbols-outlined">code</span>
                                </div>
                                <button
                                    class="text-primary hover:text-primary-container transition-colors">
                                    <span class="material-symbols-outlined"
                                        style="font-variation-settings: 'FILL' 1;">bookmark</span>
                                </button>
                            </div>
                            <div>
                                <h3
                                    class="font-headline-sm text-headline-sm text-on-surface mb-1 truncate group-hover:text-primary transition-colors">API

                                            Chen</span>
                                    </div>
                                    <span
                                        class="font-label-sm text-label-sm text-secondary">Oct
                                        08</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

<Script src="Save.js"></Script>
