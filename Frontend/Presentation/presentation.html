<!DOCTYPE html><html lang="en" style><head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <title>Etheric - Presentations Library</title>
        <script
            src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet">
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
            rel="stylesheet">
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="presentation.css">

    </head>
    <body
        class="text-on-surface antialiased overflow-hidden flex h-screen font-body-md text-body-md">
        <!-- Nav Shell Configuration from JSON -->
        <!-- SideNavBar -->

        <!-- TopAppBar -->
        <header
            class="fixed top-0 right-0 left-0 z-30 h-16 flex items-center justify-between px-gutter bg-surface dark:bg-surface-dim shadow-[0_4px_12px_rgba(70,60,120,0.04)] hidden md:flex">
            <div class="flex items-center gap-6 h-full">
                <div
                    class="relative w-64 neumorphic-inset rounded-full flex items-center px-4 py-2">
                    <span
                        class="material-symbols-outlined text-outline">search</span>
                    <input id="ppt-search-input"
                        class="bg-transparent border-none focus:ring-0 text-sm w-full font-body-sm text-body-sm text-on-surface placeholder:text-outline ml-2 p-0"
                        placeholder="Search presentations..." type="text">
                </div>
                <nav class="flex h-full font-label-md text-label-md">

                </nav>
            </div>
            <div class="flex items-center gap-4">
                <button
                    class="w-10 h-10 rounded-full neumorphic-raised flex items-center justify-center text-on-surface-variant hover:text-primary active-press transition-colors">
                    <span class="material-symbols-outlined">notifications</span>
                </button>
                <button
                    class="w-10 h-10 rounded-full neumorphic-raised flex items-center justify-center text-on-surface-variant hover:text-primary active-press transition-colors">

                </button>

                <div
                    class="w-10 h-10 rounded-full overflow-hidden border-2 border-surface neumorphic-raised cursor-pointer">
                    <img alt="User profile" data-user-avatar class="w-full h-full object-cover"
                        data-alt="A professional headshot of a young professional in a softly lit, modern office environment. High key lighting, soft neutral background, conveying approachability and competence."
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuAG2kj8cVM2X3Uc1fTTmQLlozRwklzr3L2etxuyoAaNGA3LtZeg4k8AjDtyRUhcmlYegoPM9wmCbfh75nQdUCjrE7KFdLirrCrrGe9Ge-ug03yGPwS2LqCkCmyoVvF0hMzMUNTX9bFWxfI4Y6e7SXqpcI2Yg4W4Uc6k0PapZVS8X7DwZ5Uu9uKckLE57k9L0r9y46r9murM3x8B0GORdGx1VFHYLYRwsg8pxY8ZTlvbSDO1ns7IOa1w">
                </div>
            </div>
        </header>
        <!-- Main Content Layout (3 Columns) -->
        <main
            class="flex-1 ml-0 mt-0 md:mt-16 h-[calc(100vh-64px)] flex bg-background overflow-hidden relative">
            <!-- Left Column: Persistent Chat (Compact) -->

            <!-- Center Column: Presentations Library Workspace -->
            <section
                class="flex-1 flex flex-col h-full overflow-hidden bg-background relative z-0">
                <!-- Workspace Header -->
                <div class="px-8 py-6 pb-2 shrink-0">
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <h2
                                class="font-headline-md text-headline-md text-on-surface flex items-center gap-3">
                                <a href="../Dashboard/dashboard.html"
                                    class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors neumorphic-raised" title="Back to Dashboard">
                                    <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                                </a>
                                <span
                                    class="material-symbols-outlined text-primary p-2 rounded-xl neumorphic-raised">co_present</span>
                                Presentations
                            </h2>
                            <p id="ppt-count-text"
                                class="font-body-sm text-body-sm text-on-surface-variant mt-1">14
                                decks in Project Alpha</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <button id="open-upload-ppt-btn"
                                class="h-10 px-4 rounded-xl bg-primary text-white font-label-md text-label-md active-press flex items-center gap-2 hover-lift shadow-md">
                                <span
                                    class="material-symbols-outlined text-[18px]">upload_file</span>
                                Upload PPT
                            </button>
                        </div>
                    </div>
                    <!-- Filter Bar -->
                    <div class="flex items-center gap-4 mb-4">
                        <div class="flex p-1 neumorphic-inset rounded-xl">
                            <button data-ppt-filter="all"
                                class="ppt-filter-btn px-4 py-1.5 rounded-lg bg-surface shadow-sm font-label-sm text-label-sm text-primary transition-all">All Decks</button>
                            <button data-ppt-filter="drafts"
                                class="ppt-filter-btn px-4 py-1.5 rounded-lg font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all">My Drafts</button>
                            <button data-ppt-filter="templates"
                                class="ppt-filter-btn px-4 py-1.5 rounded-lg font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all">Templates</button>
                        </div>
                    </div>
                </div>
                <!-- Cards Grid Scrollable Area -->
                <div class="flex-1 overflow-y-auto px-8 pb-8">
                    <div id="presentations-grid"
                        class="grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-3 gap-6">
                        <!-- Card 1 -->
                        <div
                            class="neumorphic-raised rounded-2xl p-5 flex flex-col group hover-lift cursor-pointer bg-surface relative overflow-hidden">
                            <!-- Decorative bg element -->
                            <div
                                class="absolute -top-10 -right-10 w-32 h-32 bg-primary/5 rounded-full blur-2xl group-hover:bg-primary/10 transition-colors"></div>
                            <div
                                class="flex justify-between items-start mb-4 relative z-10">
                                <div
                                    class="w-12 h-12 rounded-xl bg-secondary-container flex items-center justify-center text-primary shadow-inner">
                                    <span
                                        class="material-symbols-outlined text-[24px]">slideshow</span>
                                </div>
                                <button
                                    class="text-on-surface-variant hover:text-primary opacity-0 group-hover:opacity-100 transition-opacity">
                                    <span
                    </div>
                </div>
            </section>
        </main>

        <!-- Neumorphic Upload Presentation / PPT Modal -->
        <div id="upload-ppt-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm hidden p-4">
            <div class="bg-surface shadow-[inset_-4px_-4px_12px_rgba(255,255,255,0.9),_0_20px_60px_rgba(70,60,120,0.18)] border border-white/60 rounded-3xl p-6 sm:p-8 w-full max-w-lg neu-raised relative">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl neumorphic-inset text-primary flex items-center justify-center">
                            <span class="material-symbols-outlined">slideshow</span>
                        </div>
                        <div>
                            <h3 class="font-headline-sm font-bold text-on-surface">Upload Presentation</h3>
                            <p class="font-body-sm text-on-surface-variant text-xs">Add PowerPoint (.pptx, .ppt) or PDF slide decks</p>
                        </div>
                    </div>
                    <button id="close-ppt-modal-btn" class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface neumorphic-raised active:scale-95 transition-all" title="Close">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>
                <form id="upload-ppt-form" class="flex flex-col gap-4">
                    <div>
                        <label class="font-label-sm text-on-surface-variant block mb-1">Presentation Title *</label>
                        <input id="ppt-title-input" required class="w-full h-11 px-4 rounded-xl bg-surface neumorphic-inset border-none text-on-surface text-body-sm focus:ring-2 focus:ring-primary/20 outline-none" placeholder="e.g. Q4 Executive Strategy" />
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="font-label-sm text-on-surface-variant block mb-1">Category</label>
                            <select id="ppt-type-input" class="w-full h-11 px-3 rounded-xl bg-surface neumorphic-inset border-none text-on-surface text-body-sm focus:ring-2 focus:ring-primary/20 outline-none">
                                <option value="all">Pitch Deck</option>
                                <option value="drafts">Draft Deck</option>
                                <option value="templates">Template</option>
                            </select>
                        </div>
                        <div>
                            <label class="font-label-sm text-on-surface-variant block mb-1">Slide Count</label>
                            <input id="ppt-slides-input" type="number" min="1" max="200" value="18" class="w-full h-11 px-4 rounded-xl bg-surface neumorphic-inset border-none text-on-surface text-body-sm focus:ring-2 focus:ring-primary/20 outline-none" />
                        </div>
                    </div>
                    <div>
                        <label class="font-label-sm text-on-surface-variant block mb-1">Presenter / Author</label>
                        <input id="ppt-author-input" class="w-full h-11 px-4 rounded-xl bg-surface neumorphic-inset border-none text-on-surface text-body-sm focus:ring-2 focus:ring-primary/20 outline-none" placeholder="e.g. Alex M." />
                    </div>
                    <div>
                        <label class="font-label-sm text-on-surface-variant block mb-1">Choose Slide Deck File</label>
                        <div id="ppt-drop-zone" class="border-2 border-dashed border-outline-variant/50 rounded-2xl p-4 text-center cursor-pointer hover:border-primary transition-colors bg-surface/50 neumorphic-inset">
                            <span class="material-symbols-outlined text-[32px] text-primary mb-1">upload_file</span>
                            <p class="font-label-sm text-on-surface font-medium" id="ppt-drop-text">Click to choose .pptx, .ppt, or .pdf</p>
                            <p class="font-label-sm text-on-surface-variant text-[11px]">Supports PowerPoint and Keynote PDF exports</p>
                            <input type="file" id="ppt-file-input" class="hidden" accept=".ppt,.pptx,.pdf" />
                        </div>
                    </div>
                    <div>
                        <label class="font-label-sm text-on-surface-variant block mb-1">Deck Summary</label>
                        <textarea id="ppt-desc-input" rows="2" class="w-full p-3 rounded-xl bg-surface neumorphic-inset border-none text-on-surface text-body-sm focus:ring-2 focus:ring-primary/20 resize-none outline-none" placeholder="Brief summary of presentation topics..."></textarea>
                    </div>
                    <div class="flex items-center justify-end gap-3 mt-2">
                        <button type="button" id="cancel-ppt-btn" class="h-11 px-5 rounded-xl neumorphic-raised font-label-md text-on-surface-variant hover:text-on-surface transition-all">Cancel</button>
                        <button type="submit" class="h-11 px-6 rounded-xl bg-primary text-white font-label-md flex items-center gap-2 neumorphic-raised hover:opacity-90 active:scale-95 transition-all shadow-md">
                            <span class="material-symbols-outlined text-[18px]">cloud_upload</span>
                            Upload Deck
                        </button>
                    </div>
                </form>
            </div>
        </div>

                
        <script src="presentation.js?v=20260903-3"></script>
    </body></html>
