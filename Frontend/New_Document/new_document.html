<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>NeuroNex — Documents</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="new_document.css?v=20260903-v3">
</head>

<body
    class="bg-[#faf8ff] text-[#1a1b21] font-body-md h-screen w-full overflow-hidden flex selection:bg-[#593bce] selection:text-white">

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden bg-[#faf8ff]">

        <!-- ======================== TopAppBar ======================== -->
        <header class="w-full h-16 flex items-center justify-between px-6 sticky top-0 z-40 neu-header flex-shrink-0">
            <!-- Left -->
            <div class="flex items-center gap-4 h-full">
                <button id="mobile-menu-btn"
                    class="md:hidden w-10 h-10 rounded-2xl neu-btn-icon flex items-center justify-center text-[#5e5c70]">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <!-- Search Bar -->
                <div class="hidden md:flex items-center h-11 w-72 lg:w-96 rounded-2xl neu-search px-4 gap-2 group">
                    <span class="material-symbols-outlined text-[20px] text-[#797586]">search</span>
                    <input id="doc-search-input"
                        class="w-full h-full bg-transparent border-none focus:ring-0 text-[14px] text-[#1a1b21] placeholder:text-[#a09cb0] outline-none"
                        placeholder="Search documents by title, author, content..." type="text">
                    <button id="clear-search-btn"
                        class="hidden w-6 h-6 rounded-full flex items-center justify-center text-[#a09cb0] hover:text-[#593bce] transition-colors"
                        title="Clear search">
                        <span class="material-symbols-outlined text-[16px]">close</span>
                    </button>
                </div>
            </div>
            <!-- Right -->
            <div class="flex items-center gap-3">
                <!-- Mobile search toggle -->
                <button id="mobile-search-btn"
                    class="md:hidden w-10 h-10 rounded-2xl neu-btn-icon flex items-center justify-center text-[#5e5c70]">
                    <span class="material-symbols-outlined">search</span>
                </button>
                <!-- Notification bell -->
                <button
                    class="w-10 h-10 rounded-2xl neu-btn-icon flex items-center justify-center text-[#5e5c70] relative"
                    title="Notifications">
                    <span class="material-symbols-outlined">notifications</span>
                    <span class="absolute top-2 right-2 w-2.5 h-2.5 rounded-full bg-[#593bce] border-2 border-[#faf8ff]"
                        style="animation: badgePulse 2s infinite;"></span>
                </button>
                <!-- Profile -->
                <div class="w-10 h-10 rounded-2xl neu-btn-icon overflow-hidden ml-1 cursor-pointer border-2 border-[#faf8ff]"
                    title="Profile">
                    <img alt="User profile" data-user-avatar class="w-full h-full object-cover"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuBvRlmYKrFrEcarvN1EeS6K8Xe6Zh3rSrs_8RTVBG3GetBCj09tk96hVPW-jKmf_EXDlgx7Arhnn10sWgafuDTitb9OsYXTCY4aClYMiGN456LQPBXJcO-kYUSuXwKb88Fn23Fy-JalNFVBcnGJ67lQGzDByvADV2Y_KW0WtuktBS6-_hnjJq6O5zatL-Ha11sF2vkQPwdi-jYHyKwfWwSS-XG-hyrAR3ahgLRv8lzoPLHJKVKOspUS">
                </div>
            </div>
        </header>

        <!-- ======================== Content Area ======================== -->
        <div class="flex-1 flex overflow-hidden">

            <!-- Central Document Library -->
            <main class="flex-1 overflow-y-auto px-6 py-6 lg:px-8 lg:py-8 pb-28">

                <!-- Library Header -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div class="flex items-center gap-3">
                        <a href="../Dashboard/dashboard.html"
                            class="neu-btn-icon w-11 h-11 rounded-2xl flex items-center justify-center text-[#1a1b21] hover:text-[#593bce] transition-colors active:scale-95"
                            title="Back to Dashboard">
                            <span class="material-symbols-outlined text-[22px]">arrow_back</span>
                        </a>
                        <div>
                            <h3 class="text-[28px] font-bold text-[#1a1b21] leading-tight" style="font-family: Inter;">
                                Documents</h3>
                            <p id="doc-count-text" class="text-[13px] text-[#5e5c70] mt-0.5">Loading documents...</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <!-- Sort dropdown -->
                        <div class="relative" id="sort-dropdown-wrapper">
                            <button id="sort-toggle-btn"
                                class="h-11 px-4 rounded-2xl neu-btn font-medium text-[13px] text-[#5e5c70] flex items-center gap-2">
                                <span class="material-symbols-outlined text-[18px]">sort</span>
                                <span id="sort-label">Date</span>
                                <span class="material-symbols-outlined text-[16px] transition-transform duration-200"
                                    id="sort-chevron">expand_more</span>
                            </button>
                            <!-- Dropdown menu -->
                            <div id="sort-dropdown-menu"
                                class="absolute right-0 top-full mt-2 w-48 neu-dropdown py-2 hidden z-50">
                                <button data-sort="date"
                                    class="neu-dropdown-item neu-dropdown-item-active w-full flex items-center gap-3 px-4 py-2.5 text-[13px] text-left">
                                    <span class="material-symbols-outlined text-[18px]">calendar_today</span>
                                    Sort by Date
                                </button>
                                <button data-sort="name"
                                    class="neu-dropdown-item w-full flex items-center gap-3 px-4 py-2.5 text-[13px] text-left text-[#5e5c70]">
                                    <span class="material-symbols-outlined text-[18px]">sort_by_alpha</span>
                                    Sort by Name
                                </button>
                                <button data-sort="size"
                                    class="neu-dropdown-item w-full flex items-center gap-3 px-4 py-2.5 text-[13px] text-left text-[#5e5c70]">
                                    <span class="material-symbols-outlined text-[18px]">straighten</span>
                                    Sort by Size
                                </button>
                            </div>
                        </div>
                        <!-- New Document button -->
                        <button id="open-upload-btn"
                            class="h-11 px-5 rounded-2xl neu-btn-primary font-semibold text-[14px] flex items-center gap-2">
                            <span class="material-symbols-outlined text-[20px]">post_add</span>
                            New Document
                        </button>
                    </div>
                </div>

                <!-- ======================== Filter Pills ======================== -->
                <div class="flex items-center gap-2.5 overflow-x-auto pb-4 mb-5 scrollbar-hide" id="filter-bar">
                    <button data-cat="all"
                        class="filter-pill neu-pill-active px-5 py-2 rounded-2xl text-[13px] font-semibold flex items-center gap-1.5 whitespace-nowrap">
                        <span class="material-symbols-outlined text-[17px]">folder</span>
                        All Files
                    </button>
                    <button data-cat="pdf"
                        class="filter-pill neu-pill px-5 py-2 rounded-2xl text-[13px] font-medium text-[#5e5c70] flex items-center gap-1.5 whitespace-nowrap">
                        <span class="material-symbols-outlined text-[17px]">picture_as_pdf</span>
                        PDFs
                    </button>
                    <button data-cat="doc"
                        class="filter-pill neu-pill px-5 py-2 rounded-2xl text-[13px] font-medium text-[#5e5c70] flex items-center gap-1.5 whitespace-nowrap">
                        <span class="material-symbols-outlined text-[17px]">description</span>
                        Documents
                    </button>
                    <button data-cat="sheet"
                        class="filter-pill neu-pill px-5 py-2 rounded-2xl text-[13px] font-medium text-[#5e5c70] flex items-center gap-1.5 whitespace-nowrap">
                        <span class="material-symbols-outlined text-[17px]">table_view</span>
                        Spreadsheets
                    </button>
                    <button data-cat="ppt"
                        class="filter-pill neu-pill px-5 py-2 rounded-2xl text-[13px] font-medium text-[#5e5c70] flex items-center gap-1.5 whitespace-nowrap">
                        <span class="material-symbols-outlined text-[17px]">present_to_all</span>
                        Presentations
                    </button>
                    <button data-cat="notes"
                        class="filter-pill neu-pill px-5 py-2 rounded-2xl text-[13px] font-medium text-[#5e5c70] flex items-center gap-1.5 whitespace-nowrap">
                        <span class="material-symbols-outlined text-[17px]">edit_note</span>
                        Meeting Notes
                    </button>
                    <button data-cat="code"
                        class="filter-pill neu-pill px-5 py-2 rounded-2xl text-[13px] font-medium text-[#5e5c70] flex items-center gap-1.5 whitespace-nowrap">
                        <span class="material-symbols-outlined text-[17px]">code</span>
                        Tech / Code
                    </button>
                </div>

                <!-- ======================== Documents Grid ======================== -->
                <div id="documents-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-5">
                </div>

                <!-- Load More -->
                <div id="load-more-container" class="mt-8 text-center hidden">
                    <button id="load-more-btn"
                        class="h-11 px-6 rounded-2xl neu-btn font-semibold text-[14px] text-[#5e5c70] hover:text-[#1a1b21] transition-all flex items-center gap-2 mx-auto">
                        <span class="material-symbols-outlined text-[20px]">expand_more</span>
                        Load More
                    </button>
                </div>

            </main>
        </div>
    </div>

    <!-- ======================== Upload / Create Document Modal ======================== -->
    <div id="create-doc-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
        <div class="bg-[#faf8ff] neu-modal w-full max-w-lg relative p-6 sm:p-8">

            <!-- Modal Header -->
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-2xl neu-card-icon flex items-center justify-center text-[#593bce]">
                        <span class="material-symbols-outlined text-[22px]">post_add</span>
                    </div>
                    <div>
                        <h3 class="text-[18px] font-bold text-[#1a1b21]">New Document</h3>
                        <p class="text-[12px] text-[#5e5c70]">Create or upload a document to your workspace</p>
                    </div>
                </div>
                <button id="close-create-doc-btn"
                    class="w-9 h-9 rounded-2xl neu-btn-icon flex items-center justify-center text-[#a09cb0] hover:text-[#1a1b21] transition-colors"
                    title="Close">
                    <span class="material-symbols-outlined text-[20px]">close</span>
                </button>
            </div>

            <!-- Modal Form -->
            <form id="create-doc-form" class="flex flex-col gap-4">

                <!-- Title -->
                <div>
                    <label class="text-[13px] font-semibold text-[#5e5c70] block mb-1.5">Document Title <span
                            class="text-[#ba1a1a]">*</span></label>
                    <input id="doc-title-input" required
                        class="w-full h-12 px-4 neu-input text-[14px] text-[#1a1b21] placeholder:text-[#a09cb0]"
                        placeholder="e.g. Q4 Marketing Strategy" />
                </div>

                <!-- Type + Author -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="text-[13px] font-semibold text-[#5e5c70] block mb-1.5">Category / Type</label>
                        <div class="relative">
                            <select id="doc-type-input"
                                class="w-full h-12 px-4 pr-10 neu-select text-[14px] text-[#1a1b21]">
                                <option value="doc">Word Document (.docx)</option>
                                <option value="pdf">PDF Document (.pdf)</option>
                                <option value="sheet">Spreadsheet (.xlsx)</option>
                                <option value="ppt">Presentation (.pptx)</option>
                                <option value="notes">Meeting Notes</option>
                                <option value="code">Architecture / Tech</option>
                            </select>
                            <span
                                class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-[18px] text-[#797586] pointer-events-none">expand_more</span>
                        </div>
                    </div>
                    <div>
                        <label class="text-[13px] font-semibold text-[#5e5c70] block mb-1.5">Author Name</label>
                        <input id="doc-author-input"
                            class="w-full h-12 px-4 neu-input text-[14px] text-[#1a1b21] placeholder:text-[#a09cb0]"
                            placeholder="e.g. Alex Rivera" />
                    </div>
                </div>

                <!-- File Upload Drop Zone -->
                <div>
                    <label class="text-[13px] font-semibold text-[#5e5c70] block mb-1.5">Upload File <span
                            class="text-[12px] font-normal text-[#a09cb0]">(Optional)</span></label>
                    <div id="file-drop-zone" class="neu-dropzone p-6 text-center">
                        <div id="drop-zone-default" class="flex flex-col items-center">
                            <div class="w-14 h-14 rounded-2xl neu-card-icon flex items-center justify-center mb-3">
                                <span class="material-symbols-outlined text-[28px] text-[#593bce]">cloud_upload</span>
                            </div>
                            <p class="text-[14px] font-semibold text-[#1a1b21] mb-1">Click to choose a file or drag &
                                drop</p>
                            <p class="text-[12px] text-[#a09cb0]">PDF, DOCX, XLSX, PPTX, TXT — up to 25 MB</p>
                        </div>
                        <div id="drop-zone-file" class="hidden flex flex-col items-center">
                            <div class="w-14 h-14 rounded-2xl neu-card-icon flex items-center justify-center mb-3">
                                <span id="file-type-icon"
                                    class="material-symbols-outlined text-[28px] text-[#593bce]">description</span>
                            </div>
                            <p id="file-name-display"
                                class="text-[14px] font-semibold text-[#1a1b21] truncate max-w-full mb-1"></p>
                            <p id="file-size-display" class="text-[12px] text-[#5e5c70] mb-2"></p>
                            <button type="button" id="remove-file-btn"
                                class="text-[12px] font-semibold text-[#ba1a1a] hover:text-[#93000a] flex items-center gap-1 transition-colors">
                                <span class="material-symbols-outlined text-[16px]">delete_outline</span>
                                Remove file
                            </button>
                        </div>
                        <input type="file" id="doc-file-input" class="hidden"
                            accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.js,.ts,.py,.html,.css,.json,.java" />
                    </div>
                    <!-- Upload Progress -->
                    <div id="upload-progress-container" class="hidden mt-3">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="text-[12px] font-medium text-[#5e5c70]">Uploading...</span>
                            <span id="upload-progress-text" class="text-[12px] font-semibold text-[#593bce]">0%</span>
                        </div>
                        <div class="neu-progress-track h-2.5 w-full">
                            <div id="upload-progress-bar" class="neu-progress-bar h-full" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Content / Notes -->
                <div>
                    <label class="text-[13px] font-semibold text-[#5e5c70] block mb-1.5">Document Content /
                        Notes</label>
                    <textarea id="doc-content-input" rows="3"
                        class="w-full p-4 neu-textarea text-[14px] text-[#1a1b21] placeholder:text-[#a09cb0]"
                        placeholder="Enter document content, outline, or summary..."></textarea>
                </div>

                <!-- Actions -->
                <div class="flex items-center justify-end gap-3 mt-2">
                    <button type="button" id="cancel-doc-btn"
                        class="h-11 px-6 rounded-2xl neu-btn font-semibold text-[14px] text-[#5e5c70] hover:text-[#1a1b21] transition-all">
                        Cancel
                    </button>
                    <button type="submit" id="submit-doc-btn"
                        class="h-11 px-7 rounded-2xl neu-btn-primary font-semibold text-[14px] flex items-center gap-2">
                        <span class="material-symbols-outlined text-[20px]">add</span>
                        Create Document
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Document Options Menu (Three Dot Menu) -->
    <div id="doc-options-menu" class="fixed hidden z-[60] bg-[#faf8ff] neu-dropdown py-1.5 min-w-[160px] shadow-lg">
        <button id="doc-option-save"
            class="neu-dropdown-item w-full flex items-center gap-3 px-4 py-2.5 text-[13px] text-left text-[#1a1b21] hover:bg-[#f0eef6]">
            <span class="material-symbols-outlined text-[18px]">bookmark</span>
            Save
        </button>
        <button id="doc-option-delete"
            class="neu-dropdown-item w-full flex items-center gap-3 px-4 py-2.5 text-[13px] text-left text-[#ba1a1a] hover:bg-[#ffdad6]">
            <span class="material-symbols-outlined text-[18px]">delete</span>
            Delete
        </button>
    </div>

    <!-- ======================== Toast Container ======================== -->
    <div id="toast-container" class="fixed top-20 right-6 z-[60] flex flex-col gap-3 pointer-events-none">
    </div>

    <script src="new_document.js?v=20260903-v3"></script>
</body>

</html>
